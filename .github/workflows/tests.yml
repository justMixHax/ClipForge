# Runs the tests on every push and pull request.
#
# First run on 25 November 2026: see "On GitHub" in TESTING.md. The backend job takes about 18 minutes.
#
# What it does: the backend tests that need no speech model (FFmpeg is installed for the render tests), then a
# type-check and build of the interface. Nothing here calls Claude, ChatGPT or any platform: the tests use
# stand-ins for all of them.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install backend packages
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run the tests (without the ones that need the speech model)
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -m "not slow"

  interface:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install interface packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
